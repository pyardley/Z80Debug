<style>
:root {
  color: #1c1b16;
  background: #e4e1d6;
  font-family: "Segoe UI", "Helvetica Neue", sans-serif;
  font-size: 14px;
  line-height: 1.35;
}

* { box-sizing: border-box; }

body {
  margin: 0;
}

button, input, textarea {
  font: inherit;
}

button {
  background: #f7f4ea;
  border: 1px solid #8d8878;
  border-radius: 4px;
  padding: 0.28rem 0.7rem;
  cursor: pointer;
}

button:hover { background: #fff; }

button:disabled {
  cursor: not-allowed;
  color: #8a867a;
  background: #ece9df;
}

button.selected {
  background: #243024;
  color: #f4f1e6;
  border-color: #243024;
}

h1, h2, h3, p { margin: 0; }

h1 { font-size: 1.15rem; letter-spacing: 0.02em; }
h2 { font-size: 0.82rem; text-transform: uppercase; letter-spacing: 0.04em; }
h3 { font-size: 0.95rem; }

.num, textarea, .dump, .ascii, .instruction .num {
  font-family: ui-monospace, "Cascadia Mono", "Source Code Pro", Menlo, Consolas, monospace;
  font-variant-ligatures: none;
  white-space: pre;
}

.toolbar {
  display: flex;
  flex-wrap: wrap;
  gap: 0.8rem 1.2rem;
  align-items: center;
  padding: 0.55rem 0.8rem;
  background: #f7f4ea;
  border-bottom: 1px solid #c9c3b2;
}

.title-block p, .hint, .flag-caption {
  color: #5e5a50;
  font-size: 0.78rem;
}

.controls, .format {
  display: flex;
  gap: 0.35rem;
  align-items: center;
}

.format-label { font-size: 0.78rem; color: #5e5a50; }

.caption {
  margin: 0;
  padding: 0.35rem 0.8rem;
  background: #f3efe2;
  border-bottom: 1px solid #c9c3b2;
  font-size: 0.82rem;
}

.bench {
  display: flex;
  align-items: flex-start;
  padding: 0.5rem 0.4rem;
}

.bench-main { flex: 1 1 auto; min-width: 0; }

.console-pane {
  margin: 0 0 0.6rem;
  background: #fbfaf5;
  border: 1px solid #c9c3b2;
  border-radius: 6px;
  padding: 0.5rem 0.6rem 0.55rem;
}

.console-ports {
  color: #3f3a32;
  font-size: 0.78rem;
}

.console-ports p { margin: 0.12rem 0; }

.console-screen {
  min-height: 4.6rem;
  max-height: 8rem;
  overflow: auto;
  margin: 0.35rem 0;
  padding: 0.4rem 0.5rem;
  background: #1c241c;
  color: #d7f5c8;
  border-radius: 4px;
  font-family: ui-monospace, "Cascadia Mono", "Source Code Pro", Menlo, Consolas, monospace;
  font-size: 14px;
  line-height: 1.4;
  white-space: pre-wrap;
  word-break: break-word;
}

.console-form {
  display: flex;
  flex-wrap: wrap;
  gap: 0.35rem;
  align-items: center;
}

.console-form input {
  flex: 1;
  min-width: 12rem;
  font-family: ui-monospace, "Cascadia Mono", "Source Code Pro", Menlo, Consolas, monospace;
  border: 1px solid #c9c3b2;
  border-radius: 4px;
  padding: 0.2rem 0.35rem;
  background: #fffef9;
}

.menu { position: relative; }

.menu-panel {
  position: absolute;
  top: calc(100% + 0.25rem);
  left: 0;
  z-index: 20;
  min-width: 14rem;
  padding: 0.25rem;
  background: #fffef9;
  border: 1px solid #8d8878;
  border-radius: 6px;
  box-shadow: 0 8px 20px rgba(40, 36, 24, 0.12);
  display: flex;
  flex-direction: column;
  gap: 0.1rem;
}

.menu-panel[hidden] { display: none; }

.menu-panel button {
  display: flex;
  justify-content: space-between;
  gap: 1rem;
  width: 100%;
  text-align: left;
  background: transparent;
  border-color: transparent;
}

.menu-panel button:hover { background: #efe8d4; }

.shortcut {
  color: #5e5a50;
  font-size: 0.75rem;
}

.menu-separator {
  height: 1px;
  background: #c9c3b2;
  margin: 0.2rem 0.15rem;
}

.source-title {
  display: flex;
  flex-direction: column;
  gap: 0.1rem;
  min-width: 0;
}

.loaded-name {
  font-family: ui-monospace, "Cascadia Mono", "Source Code Pro", Menlo, Consolas, monospace;
  font-size: 0.78rem;
  color: #1f4d32;
}

.file-status {
  margin: 0 0 0.35rem;
  color: #1f4d32;
  font-size: 0.78rem;
}

.file-status:empty { display: none; }

.source-actions {
  display: flex;
  flex-wrap: wrap;
  gap: 0.35rem;
  align-items: center;
  justify-content: flex-end;
}

.example-label {
  color: #5e5a50;
  font-size: 0.78rem;
}

#examples {
  font: inherit;
  background: #fffef9;
  border: 1px solid #8d8878;
  border-radius: 4px;
  padding: 0.22rem 0.35rem;
  max-width: 12rem;
}

.source-hint { margin-bottom: 0.35rem; }

.workspace {
  display: flex;
  align-items: flex-start;
  min-width: 0;
}

.editor-pane { flex: 0 0 auto; width: 537px; }
.cpu-pane { flex: 1 1 auto; min-width: 420px; }

.split {
  flex: 0 0 auto;
  align-self: stretch;
  width: 10px;
  margin: 0 2px;
  padding: 0;
  border: 0;
  border-radius: 4px;
  background: transparent;
  cursor: col-resize;
  touch-action: none;
  position: relative;
}

.split::before {
  content: "";
  position: absolute;
  top: 0.35rem;
  bottom: 0.35rem;
  left: 4px;
  width: 2px;
  border-radius: 1px;
  background: #c9c3b2;
}

.split:hover::before,
.split:focus-visible::before {
  background: #1f4d32;
}

.split:focus-visible {
  outline: 2px solid #1f4d32;
  outline-offset: 1px;
}

.editor-pane, .cpu-pane, .memory-pane > div {
  background: #fbfaf5;
  border: 1px solid #c9c3b2;
  border-radius: 6px;
  padding: 0.5rem 0.6rem;
  min-width: 0;
}

.pane-head {
  display: flex;
  justify-content: space-between;
  gap: 0.6rem;
  align-items: baseline;
  margin-bottom: 0.35rem;
}

.source-scroll {
  display: flex;
  height: 22rem;
  overflow: hidden;
  border: 1px solid #c9c3b2;
  background: #fffef9;
  padding: 6px 0;
  box-sizing: border-box;
}

.source-scroll:focus-within {
  outline: 2px solid #1f4d32;
  outline-offset: 1px;
}

.source-gutter-clip {
  flex: none;
  align-self: stretch;
  width: 5rem;
  overflow: hidden;
  background: #f3efe4;
  border-right: 1px solid #ddd6c4;
}

.source-gutter {
  padding: 0 0.35rem 0 0.2rem;
  font-family: ui-monospace, "Cascadia Mono", "Source Code Pro", Menlo, Consolas, monospace;
  font-size: 14px;
  line-height: 20px;
}

.gutter-row {
  display: flex;
  justify-content: flex-end;
  align-items: center;
  gap: 0.3rem;
  height: 20px;
  color: #6d685e;
}

.gutter-row.runnable { cursor: pointer; }
.gutter-row.runnable:hover { background: #e7f0dc; }

.num[data-key],
#memory-pc .mem-byte,
#memory-focus .mem-byte { cursor: pointer; }

.value-edit {
  font: inherit;
  width: 8ch;
  max-width: 100%;
  border: 1px solid #8d8878;
  border-radius: 4px;
  padding: 0 0.15rem;
  background: #fff;
}

.value-edit.invalid { outline: 2px solid #7a2e16; }

.gutter-row.current {
  background: #cfe3b8;
  box-shadow: inset 3px 0 0 #1f4d32;
  color: #1c1b16;
  font-weight: 700;
}

.pc-marker {
  width: 1.1ch;
  text-align: center;
  color: #1f4d32;
}

.line-no {
  min-width: 2ch;
  text-align: right;
}

.source-code {
  position: relative;
  flex: 1 1 auto;
  min-width: 0;
  min-height: 0;
  overflow: hidden;
  display: flex;
  flex-direction: column;
}

.source-highlights {
  position: absolute;
  top: 0;
  left: 0;
  right: 0;
  pointer-events: none;
  z-index: 0;
}

.highlight-row {
  height: 20px;
}

.highlight-row.current {
  background: #cfe3b8;
  box-shadow: inset 3px 0 0 #1f4d32;
}

textarea {
  position: relative;
  z-index: 1;
  flex: 1 1 auto;
  min-height: 0;
  width: 100%;
  height: 100%;
  resize: none;
  border: 0;
  margin: 0;
  padding: 0 8px;
  background: transparent;
  line-height: 20px;
  font-size: 14px;
  overflow: auto;
}

.source-pointer {
  margin-top: 0.35rem;
  min-height: 1.2em;
  font-size: 0.82rem;
  font-weight: 650;
  color: #1f4d32;
}

.source-pointer.outside {
  color: #6d4a00;
}

.status {
  padding: 0.3rem 0.45rem;
  background: #e7f0e4;
  border-radius: 4px;
  margin-bottom: 0.4rem;
}

.status.halted {
  background: #f6e0c4;
  font-weight: 650;
}

.instruction p { margin: 0.1rem 0; }
.insn-label {
  display: inline-block;
  width: 3.2rem;
  color: #5e5a50;
  font-size: 0.78rem;
}

.system-regs, .reg-row, .flags {
  display: flex;
  flex-wrap: wrap;
  gap: 0.25rem 0.7rem;
  align-items: baseline;
  margin-top: 0.25rem;
}

.reg-pair {
  display: inline-flex;
  align-items: baseline;
  gap: 0.25rem 0.7rem;
}

.system-regs .reg-pair + .reg-pair {
  margin-left: 1.35rem;
}

.reg { display: inline-flex; gap: 0.3rem; align-items: baseline; }
.reg-name { color: #5e5a50; min-width: 1.6rem; }

.num.byte { min-width: 8ch; }
.num.word { min-width: 16ch; }

.format-ascii .num.byte,
.format-ascii .mem-byte {
  display: inline-block;
  width: 1.25em;
  min-width: 1.25em;
  text-align: center;
}

.format-ascii .num.word {
  display: inline-block;
  width: 2.6em;
  min-width: 2.6em;
  text-align: center;
}

.banks {
  display: grid;
  grid-template-columns: repeat(2, minmax(0, 1fr));
  gap: 0.5rem;
  margin-top: 0.45rem;
}

.bank {
  border: 1px solid #ddd6c4;
  border-radius: 5px;
  padding: 0.4rem 0.5rem 0.5rem;
}

.reg-group { margin-top: 0.35rem; }

.group-head {
  display: flex;
  justify-content: space-between;
  gap: 0.4rem;
  align-items: center;
}

.badge {
  font-size: 0.75rem;
  font-weight: 700;
  letter-spacing: 0.04em;
  text-transform: uppercase;
  border-radius: 999px;
  padding: 0.05rem 0.45rem;
}

.badge.active {
  background: #1f4d32;
  color: #f4fff6;
}

.badge.shadow {
  background: #fff;
  color: #3f3a32;
  border: 1px solid #3f3a32;
}

.flag {
  position: relative;
  display: inline-block;
  min-width: 1.6rem;
  text-align: center;
  border-radius: 3px;
  color: #8a8478;
  font-family: ui-monospace, Menlo, Consolas, monospace;
  cursor: help;
}

.flag.set {
  color: #1c1b16;
  font-weight: 750;
  background: #e5ecdf;
}

.num.changed, .mem-byte.changed, .flag.changed, .badge.changed {
  background: #f3d48a;
  box-shadow: inset 3px 0 0 #6d4a00;
}

.flag-state { margin-left: 0.2rem; }

.reg-help { position: relative; cursor: help; }

.flag-bubble,
.reg-bubble {
  display: none;
  position: absolute;
  z-index: 40;
  left: 50%;
  bottom: calc(100% + 0.4rem);
  transform: translateX(-50%);
  width: max-content;
  max-width: 16rem;
  padding: 0.45rem 0.55rem;
  text-align: left;
  white-space: normal;
  font-family: "Segoe UI", "Helvetica Neue", sans-serif;
  font-size: 13px;
  font-weight: 650;
  line-height: 1.35;
  color: #1c1b16;
  background: #fffef9;
  border: 1px solid #8d8878;
  border-radius: 6px;
  box-shadow: 0 8px 18px rgba(40, 36, 24, 0.18);
  pointer-events: none;
}

.flag:hover .flag-bubble,
.flag:focus-within .flag-bubble,
.reg-help:hover .reg-bubble,
.reg-help:focus-within .reg-bubble {
  display: block;
}

.num.changed::before, .mem-byte.changed::before, .flag.changed::before {
  content: "*";
  color: #6d4a00;
  font-weight: 750;
}

.badge.changed::after {
  content: " changed";
  font-weight: 650;
  text-transform: none;
  letter-spacing: 0;
}

.pc-byte {
  outline: 1px solid #1f4d32;
  outline-offset: 1px;
}

.memory-pane {
  display: flex;
  flex: 0 0 auto;
  flex-direction: column;
  gap: 0.6rem;
  width: 570px;
  min-width: 0;
}

.memory-pane > div { min-width: 0; }

.dump { overflow-x: auto; }

.stack-sp { margin: 0.15rem 0 0.35rem; }

.stack-row {
  display: grid;
  grid-template-columns: 4.4rem auto auto minmax(0, 1fr);
  gap: 0.35rem;
  align-items: center;
  min-height: 1.45rem;
}

.stack-row[data-stack-top="true"] {
  background: #cfe3b8;
  box-shadow: inset 3px 0 0 #1f4d32;
  border-radius: 3px;
}

.stack-mark {
  font-family: ui-monospace, "Cascadia Mono", "Source Code Pro", Menlo, Consolas, monospace;
  font-weight: 700;
  color: #1f4d32;
}

.stack-row .num.word { min-width: 4.5ch; }
.format-binary .stack-row .num.word { min-width: 16ch; }
.format-decimal .stack-row .num.word { min-width: 5.4ch; }

.stack-note {
  color: #1f4d32;
  font-size: 0.78rem;
  font-weight: 700;
}

.dump-row {
  display: flex;
  flex-wrap: nowrap;
  gap: 0.4rem;
  align-items: baseline;
  white-space: nowrap;
}

.bytes { display: inline-flex; gap: 0.16rem; flex-wrap: nowrap; }
.addr { color: #5e5a50; }
.ascii { color: #3f4a3f; }

.writes p { margin: 0.15rem 0 0.3rem; }
.write { font-family: ui-monospace, Menlo, Consolas, monospace; }

.jump {
  display: flex;
  gap: 0.3rem;
  align-items: center;
}

.jump input {
  width: 7.5rem;
  font-family: ui-monospace, Menlo, Consolas, monospace;
  border: 1px solid #c9c3b2;
  border-radius: 4px;
  padding: 0.2rem 0.35rem;
}

.errors {
  margin-top: 0.4rem;
  color: #7a2e16;
}

.errors ul { margin: 0.25rem 0 0; padding-left: 1.1rem; }

@media (max-width: 1100px) {
  .bench, .workspace { display: block; }
  .banks { grid-template-columns: 1fr; }
  .split { display: none; }
  .editor-pane, .cpu-pane, .memory-pane {
    width: auto !important;
    min-width: 0 !important;
  }
  .source-scroll { height: 14rem; }
}
</style>
</head>

      <div class="console-ports">
        <p><strong>00H data.</strong> OUT (00H),A appends A to the console. IN A,(00H) returns the next character you typed and removes it from the queue. If the queue is empty, IN returns 00H.</p>
        <p><strong>01H status.</strong> IN A,(01H) returns 0FFH when at least one character is queued, and 00H when the queue is empty. OUT to 01H is ignored.</p>
        <p>Every other port stays as it was: IN returns 0FFH and OUT is discarded. 0AH and 0DH start a new line, and a CR+LF pair is one new line. 08H deletes the last character on the current line. 09H is a tab to the next multiple of 8. 20H–7EH are the ASCII glyph. Any other byte is a middle dot.</p>
